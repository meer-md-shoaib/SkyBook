<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="SkyBook airliner cruising above the clouds">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eaf4ff"/>
      <stop offset="1" stop-color="#b9d5f0"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cc4e8"/>
      <stop offset="1" stop-color="#5f93c6"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e86de"/>
      <stop offset="1" stop-color="#14508f"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <g opacity="0.55" filter="url(#soft)">
    <ellipse cx="640" cy="300" rx="260" ry="46" fill="#64aef0" opacity="0.5"/>
  </g>

  <!-- contrails -->
  <path d="M120 250 C 300 236, 420 226, 540 214 L 540 224 C 420 236, 300 248, 120 264 Z" fill="url(#trail)" opacity="0.7"/>
  <path d="M90 292 C 280 282, 400 274, 520 264 L 520 272 C 400 284, 280 294, 90 304 Z" fill="url(#trail)" opacity="0.45"/>

  <!-- fuselage -->
  <g transform="rotate(-9 500 220)">
    <path d="M470 132 C 640 128, 790 168, 856 202 C 874 211, 874 229, 856 238 C 790 272, 640 312, 470 308 C 424 307, 402 288, 402 220 C 402 152, 424 133, 470 132 Z" fill="url(#body)" stroke="#cfe2f5" stroke-width="2"/>
    <!-- belly shadow -->
    <path d="M470 270 C 620 272, 760 252, 848 226 C 862 232, 866 234, 856 238 C 790 272, 640 312, 470 308 C 430 307, 408 292, 404 262 Z" fill="#9dbfdf" opacity="0.35"/>
    <!-- windows -->
    <g fill="#2b5d8f" opacity="0.85">
      <circle cx="500" cy="196" r="4.4"/><circle cx="524" cy="194" r="4.4"/><circle cx="548" cy="193" r="4.4"/>
      <circle cx="572" cy="192" r="4.4"/><circle cx="596" cy="192" r="4.4"/><circle cx="620" cy="192" r="4.4"/>
      <circle cx="644" cy="192" r="4.4"/><circle cx="668" cy="193" r="4.4"/><circle cx="692" cy="194" r="4.4"/>
      <circle cx="716" cy="196" r="4.4"/><circle cx="740" cy="198" r="4.4"/><circle cx="764" cy="200" r="4.4"/>
      <circle cx="788" cy="203" r="4.2"/><circle cx="810" cy="206" r="3.8"/>
    </g>
    <!-- cockpit -->
    <path d="M806 200 C 828 204, 844 210, 852 216 C 836 218, 818 214, 806 208 Z" fill="#123a68" opacity="0.9"/>
    <!-- airline stripe -->
    <path d="M402 236 C 520 246, 700 250, 862 228" stroke="#2e86de" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M402 262 C 520 270, 700 274, 862 250" stroke="#0b2447" stroke-width="3" fill="none" opacity="0.55"/>
    <!-- engine -->
    <ellipse cx="596" cy="290" rx="52" ry="23" fill="#dbe9f7" stroke="#a9c8e6" stroke-width="2"/>
    <ellipse cx="596" cy="290" rx="20" ry="13" fill="#123a68"/>
    <!-- wing -->
    <path d="M520 246 L 404 356 C 380 376, 400 386, 430 374 L 612 288 Z" fill="url(#wing)" opacity="0.95"/>
    <path d="M470 262 L 410 344" stroke="#eaf4ff" stroke-width="3" opacity="0.7"/>
    <!-- tail fin -->
    <path d="M418 168 L 352 92 C 344 82, 332 92, 340 108 L 402 200 Z" fill="url(#fin)"/>
    <path d="M380 118 L 352 92" stroke="#ffffff" stroke-width="4" opacity="0.6"/>
    <!-- tail wing -->
    <path d="M430 300 L 356 360 C 344 368, 352 378, 368 372 L 462 312 Z" fill="#a9c8e6" opacity="0.9"/>
  </g>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.16">
    <ellipse cx="220" cy="360" rx="180" ry="42"/>
    <ellipse cx="430" cy="386" rx="220" ry="40"/>
    <ellipse cx="760" cy="370" rx="200" ry="44"/>
  </g>
  <g fill="#ffffff" opacity="0.1">
    <ellipse cx="120" cy="392" rx="160" ry="30"/>
    <ellipse cx="640" cy="404" rx="260" ry="34"/>
  </g>
</svg>
